<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Nemat Tech Store</title>
</head>
<body>
   
<div class="form">
    <div class="form-items">
        <input type="text" placeholder="First Name" class="inputs items">
        <input type="text" placeholder="Last Name" class="inputs items">
        <input type="tel" name="Phone Number" id="  phone-num" placeholder="Phone Number" class="inputs items">
        <input type="email" name="email" id="email" placeholder="Email" class="inputs items" >
        <select name="country" id="country" class="opt items">
            <option value="Please Select country">Please Select country</option>
            <option value="Iran">Iran</option>
            <option value="AFG">AFG</option>
            <option value="USA">USA</option>
            <option value="Pakistan">Pakistan</option>
        </select>
        <select name="city" id="city" class="opt items">
            <option value="Select city">Please Select City</option>
        </select>
        <button id="btn">Book a ticket</button>
    </div>
</div>
<script src="main.js"></script>
</body>
</html>
